    body: '{"title":"eh30pt-e2e-delete","label_config":"<View>\n  <Text name=\"text\"
      value=\"$text\" />\n  <Style>\n        .eh30pt-title {\n            border:
      1px solid transparent;\n            border-radius: 3px;\n            padding:
      2px 8px;\n            margin-bottom: 4px;\n        }\n\n        .eh30pt-box:has(input:checked)
      .eh30pt-title {\n            border-color: #1f9d55;\n        }\n    </Style>\n  <View
      style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start\">\n    <View
      className=\"eh30pt-box\" style=\"flex: 1; min-width: 240px\">\n      <View className=\"eh30pt-title\">\n        <Header
      value=\"Drug discontinuation\" />\n      </View>\n      <Choices name=\"discont\"
      toName=\"text\" choice=\"multiple\" showInLine=\"false\">\n        <Choice value=\"Treatment
      success\" hint=\"Treatment stopped because it worked, was completed, or the
      patient improved enough.\" />\n        <Choice value=\"Treatment inefficacy\"
      hint=\"Treatment stopped because it was seen as ineffective.\" />\n        <Choice
      value=\"Contraindication/unsafe co-usage\" hint=\"Treatment stopped because
      a condition or risk factor made continuing it unsafe or inappropriate.\" />\n        <Choice
      value=\"Adverse reactions\" hint=\"Treatment stopped because of adverse side
      effects, allergic reactions, or negative interactions with other medications.\"
      />\n        <Choice value=\"Other\" hint=\"Treatment stopped for other or unknown
      reasons.\" />\n      </Choices>\n    </View>\n    <View className=\"eh30pt-box\"
      style=\"flex: 1; min-width: 240px\">\n      <View className=\"eh30pt-title\">\n        <Header
      value=\"Not discontinuation\" />\n      </View>\n      <Choices name=\"other\"
      toName=\"text\" choice=\"multiple\" showInLine=\"false\">\n        <Choice value=\"Adverse
      reaction without discontinuation\" hint=\"Adverse side effects, allergic reactions,
      or negative interactions where treatment continued or was not the reason it
      stopped.\" />\n        <Choice value=\"Treatment inefficacy without discontinuation\"
      hint=\"Treatment was seen as ineffective but was not stopped because of it.\"
      />\n        <Choice value=\"Dosage change\" hint=\"Dose was increased or decreased.
      No justification or cause is needed.\" />\n        <Choice value=\"Other non-discontinuation\"
      hint=\"An event that is neither a discontinuation nor any of the reasons listed
      here.\" />\n      </Choices>\n    </View>\n    <View className=\"eh30pt-box\"
      style=\"flex: 1; min-width: 240px\">\n      <View className=\"eh30pt-title\">\n        <Header
      value=\"Meta\" />\n      </View>\n      <Choices name=\"meta\" toName=\"text\"
      choice=\"multiple\" showInLine=\"false\">\n        <Choice value=\"Incomplete
      phrase\" hint=\"Phrase too short to decide alone but decidable when expanded;
      annotate the expanded phrase. Use only when obvious.\" />\n        <Choice value=\"Incorrect
      phrase\" hint=\"Extracted phrase is noise or a false positive; any real description
      is elsewhere. Use only when obvious.\" />\n      </Choices>\n    </View>\n  </View>\n  <View
      style=\"display: none\">\n    <Labels name=\"span\" toName=\"text\">\n      <Label
      value=\"phrase\" background=\"#ffe08a\" />\n      <Label value=\"reason\" background=\"#a9c6ff\"
      />\n      <Label value=\"drug\" background=\"#a8e6a3\" />\n    </Labels>\n  </View>\n</View>"}'
