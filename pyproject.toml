[project]
name = "eh30pt"
version = "0.1.0"
description = "Prompt tuning on Est-Health 30"
readme = "README.md"
authors = [{ name = "mart-mihkel", email = "mart.mihkel.aun@gmail.com" }]
requires-python = "~=3.14.7"
dependencies = [
    "pydantic-settings~=2.15.0",
    "psycopg[binary]~=3.2",
    "transformers~=5.17.0",
    "bitsandbytes~=0.50.2",
    "langextract~=1.7.0",
    "accelerate~=1.15.0",
    "rich-click~=1.9.0",
    "sqlalchemy~=2.0.0",
    "pydantic~=2.13.5",
    "tiktoken~=0.14.0",
    "datasets~=5.0.1",
    "returns~=0.29.0",
    "estnltk~=1.7.5",
    "openai~=3.10.0",
    "mlflow~=3.16.0",
    "polars~=1.44.2",
    "torch~=2.14.0",
    "httpx~=0.28.1",
    "rich~=15.0.0",
    "peft~=0.20.0",
    "trl~=1.13.0",
]

[dependency-groups]
dev = [
    "ty",
    "prek",
    "ruff",
    { include-group = "test" },
    { include-group = "notebooks" },
]

test = [
    "testcontainers",
    "pytest-recording",
    "pytest-xdist",
    "pytest-cov",
    "pytest",
]

notebooks = [
    "ipykernel",
    "plotnine",
    "ipython",
    "marimo",
]

[project.scripts]
ehpt = "eh30pt.cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2 days"

[tool.pytest.ini_options]
markers = [
    "slow: slow tests, skipped unless --run-slow is passed",
]

filterwarnings = [
    "error::DeprecationWarning",
    "error::FutureWarning",
    "error::RuntimeWarning",
    "error::UserWarning",

    "ignore:.*inferred as AnyType.*:UserWarning",                # MLflow infers an Any type schema from its own ResponsesAgentRequest model
    "ignore:.*codecs.open.*is deprecated.*:DeprecationWarning",  # MLflow still uses codecs.open() internally, deprecated in Python 3.14.
    "ignore:.*use_reentrant.*:UserWarning",                      # PEFT enables gradient checkpointing without an explicit use_reentrant flag.
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",   # Trailing comma missing
    "CPY001",   # Missing copyright notice at top of file
    "D203",     # 1 blank line required before class docstring
    "D212",     # Multi-line docstring summary should start at the first line
    "PLC0415",  # import should be at the top-level of a file 
    "PLR0913",  # Too many arguments in function definition
]

[tool.ruff.lint.per-file-ignores]
"{test}/**" = [
    "D103",     # Missing docstring in public function
    "FBT003",   # Boolean positional value in function call
    "S101",     # Use of assert detected
    "SLF001",   # Private member access in white-box tests
]

"{notebooks}/**" = [
    "ANN001",   # Missing type annotation for function argument
    "ANN202",   # Missing return type annotation for private function
    "B018",     # Found useless expression.
    "D100",     # Missing docstring in public module
    "D103",     # Missing docstring in public function
    "ERA001",   # Found commented-out code
    "INP001",   # File is part of an implicit namespace package
    "PLR1711",  # Useless `return` statement at end of function
    "PLR0917",  # Too many positional arguments
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic_settings.BaseSettings",
    "pydantic.BaseModel",
]
