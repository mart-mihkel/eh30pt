services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llama
    restart: unless-stopped
    ports:
      - "${LLAMA_PORT:-9931}:9931"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - llama-models:/root/.cache/llama.cpp
    command:
      - -hf
      - unsloth/Qwen2.5-Coder-0.5B-Instruct-GGUF:Q4_K_M
      - --host
      - 0.0.0.0
      - --port
      - "9931"
      - --parallel
      - "2"
      - --ctx-size
      - "8192"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9931/health || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "2"
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "${LABEL_STUDIO_PORT:-8080}:8080"
    environment:
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME:-ls@ls.ls}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD:-ls}
      LABEL_STUDIO_USER_TOKEN: ${LABEL_STUDIO_TOKEN:-eh30pt-dev-token}
      LABEL_STUDIO_ENABLE_LEGACY_API_TOKEN: "true"
    volumes:
      - label-studio-data:/label-studio/data
      - ./deploy/label-studio/40-dev-token.sh:/label-studio/deploy/docker-entrypoint.d/app-docker/40-dev-token.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  label-studio-data:
  llama-models:
  mlflow-artifacts:
